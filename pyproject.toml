[project]
name = "financial-assistant"
version = "1.0.0"
description = "Интеллектуальный ассистент для анализа и прогнозирования личных финансов"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "N",   # naming conventions
    "B",   # common bugs
    "UP",  # modern Python syntax
    "SIM", # simplifications
    "RUF", # ruff-specific rules
]
# Cyrillic letters in UI strings are intentional, not "confusable" characters.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Deprecation warnings raised inside third-party test tooling, not in project code.
filterwarnings = [
    "ignore::DeprecationWarning:starlette.testclient",
    "ignore:Using `httpx` with `starlette.testclient`",
]
